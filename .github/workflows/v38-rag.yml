name: V3.8 RAG evidence checks
on:
  push:
    paths: ['versions/rag*', 'versions/v33.html', 'practical/README-rag-v38.md', 'tests/rag-evidence.cjs', '.github/workflows/v38-rag.yml']
  pull_request:
    paths: ['versions/rag*', 'versions/v33.html', 'practical/README-rag-v38.md', 'tests/rag-evidence.cjs', '.github/workflows/v38-rag.yml']
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/rag-evidence.cjs

