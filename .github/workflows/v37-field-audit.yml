name: V3.7 field data quality tests
on:
  push:
    paths: ['practical/**', '.github/workflows/v37-field-audit.yml']
  pull_request:
    paths: ['practical/**', '.github/workflows/v37-field-audit.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s practical -p 'test_*.py' -v
      - run: python practical/v37_field_audit.py practical/example_field_data.csv
